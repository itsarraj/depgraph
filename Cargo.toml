[package]
name = "depgraph"
version = "0.1.0"
edition = "2021"
description = "Builds a dependency graph between crates in a Cargo workspace or a directory of standalone crates, renders it as Graphviz DOT, and reports any circular dependency chains"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/depgraph"
readme = "README.md"
keywords = ["cargo", "dependency-graph", "graphviz", "cli", "cycle-detection"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "depgraph"
path = "src/lib.rs"

[[bin]]
name = "depgraph"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
